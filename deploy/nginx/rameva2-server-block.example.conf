# Rameva 2 — пример конфигурации Nginx (справочный материал).
#
# Фреймворк спроектирован независимо от веб-сервера: маршрутизация
# обеспечивается единой точкой входа public/index.php. На Apache это делает
# public/.htaccess, но на Nginx .htaccess не действует, поэтому ограничения
# из этого файла нужно перенести в свой server-блок.
#
# Зачем это нужно:
# 1. Каталоги pages/, app/, system/ лежат внутри docroot, поэтому веб-сервер
#    отдаёт их содержимое напрямую как статические файлы. pages/*.html —
#    это исходные шаблоны с плейсхолдерами {{ ... }}: прямой запрос к ним
#    даёт дубль контента и раскрывает внутреннюю структуру шаблонов.
#    Через PHP это не исправить (запрос не доходит до фреймворка), поэтому
#    запрет делается на уровне сервера.
# 2. Каталог storage/ (кэш, логи, сессии, загрузки, манифест целостности)
#    не должен отдаваться наружу никогда — на Apache его закрывает
#    storage/.htaccess, на Nginx нужна такая же директива ниже.
#
# Проверьте и замените: server_name, root, fastcgi_pass, пути к логам.

server {
    listen 80;
    server_name fw2.loc;
    root /var/www/fw2.loc/public;
    index index.php;

    # 1. Внутренние каталоги фреймворка — никогда не отдаются напрямую.
    #    Вариант «return 404» неотличим от обычной несуществующей страницы;
    #    вариант «deny all» даёт 403. Выберите один.
    location ^~ /pages/  { return 404; }
    location ^~ /app/    { return 404; }
    location ^~ /system/ { return 404; }

    # 2. Служебное хранилище (кэш, логи, сессии, integrity-манифест).
    location ^~ /storage/ { return 404; }

    # 3. Скрытые файлы (.htaccess, .env, .git и т.п.)
    location ~ /\. { return 404; }

    # 4. Единая точка входа: только реально существующие файлы отдаются
    #    как статика (assets/, robots.txt, sitemap.xml, llms.txt, favicon);
    #    всё остальное — в index.php.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 5. Обработка PHP.
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 6. Точка входа внешнего расписания (Tripwire) — доступна, но требует
    #    ключ из app/Config/Security.php (integrity.token).
    #    Пример вызова из CRON:
    #    wget -q -O /dev/null "https://fw2.loc/cron.php?key=ВАШ_КЛЮЧ&action=check"

    # 7. Отдача статики с кэшированием (необязательно).
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|webp|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
