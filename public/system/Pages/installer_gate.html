<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Сайт временно недоступен</title>
<style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #f4f6f8;
        color: #37474f;
    }
    .card {
        max-width: 460px;
        width: 100%;
        background: #fff;
        border-radius: 12px;
        padding: 32px 28px;
        box-shadow: 0 2px 16px rgba(38, 50, 56, .08);
        text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.15rem; font-weight: 600; }
    p { margin: 0; font-size: .92rem; line-height: 1.55; color: #607d8b; }
</style>
</head>
<body>
    <div class="card">
        <h1>Сайт временно недоступен</h1>
        <p>Ведутся технические работы. Пожалуйста, зайдите позже.</p>
    </div>
</body>
</html>
